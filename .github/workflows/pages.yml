name: Site checks + data refresh

# GitHub Pages serves the repository root of `main` (legacy branch source).
# This workflow:
#   1. runs the site checks on every push/PR: engine tests (jsdom), offline lib tests,
#      JS syntax + broken-link check, and the per-row official-source check;
#   2. on schedule/dispatch, refreshes data/ from the official Kalshi DEMO Trade API
#      (public, read-only, no credentials) and commits it back with [skip ci].

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (UTC)

permissions:
  contents: read

concurrency:
  group: site-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # jsdom >= 31 needs Node >= 22 at runtime; pinning both here keeps the
      # check reproducible on the runner and in a local sandbox.
      - name: Install test dependency (jsdom)
        run: npm install --no-audit --no-fund jsdom@26.1.0
      - name: Engine tests (real dashboard code in jsdom, offline fixtures)
        run: node tests/engine.test.mjs
      - name: Library tests (offline fixtures)
        run: node scripts/test_lib.mjs
      - name: Unit checks — engine math (fees, alert threshold, classifier)
        run: node tests/root_engine.test.js
      # ORDERING (deliberate): the snapshot is refreshed from the official demo
      # API BEFORE the gate runs, so the gate checks FRESHLY COLLECTED data
      # instead of the committed snapshot (which may predate a classification
      # fix). The collector is public, read-only and needs no credentials.
      # If the refresh fails the committed snapshot is restored and the gate
      # reports the snapshot as stale rather than blaming the collector.
      - name: Refresh the snapshot from the official demo API (public, read-only)
        run: |
          if python3 scripts/collect.py; then
            echo "snapshot refreshed from the official demo API"
          else
            echo "::warning::collector refresh failed; continuing with the committed snapshot"
            git checkout -- data || true
          fi
      - name: "Collector classification and pagination regression gate (defects D1 and D3)"
        run: python3 tests/test_collect.py
      - name: Topic-classification parity (collector vs the browser mirror, flagged item 9d-1)
        run: node tests/collector.test.mjs
      - name: Every rendered table row links its own official record (data.html, resolved.html)
        run: node scripts/check_row_sources.mjs
      - name: Unit checks — demo-account track (official fee table, signing, paper portfolio)
        run: node tests/demo-account.test.mjs
      - name: JS syntax, internal links, nav targets
        run: node tools/build.mjs
      - name: Every page link resolves and every snapshot row has an official source URL
        run: node scripts/check_site.mjs
      - name: Fee model vs the official fee schedule table (42 published rows + per-series multipliers)
        run: node scripts/test_fees.mjs
      - name: Dashboard model checks (alert threshold, classifier, ROI screen, fill band)
        run: node scripts/test_model.mjs
      - name: Live-dashboard regressions (alert topic, full watchlist polling, determined/amended results)
        run: node tests/live_fixes.test.mjs
      - name: Render every published page in jsdom (empty-render / JS-error gate)
        # jsdom ships no canvas backend, so the canvas guard in assets/app.js keeps the
        # page alive there; every other JS error still fails the run. This is what
        # caught the five topic pages rendering blank and the Resolved page loading a
        # module that no longer existed.
        run: |
          node tools/render_test.mjs --wait=9000 \
            index.html dashboard.html trades.html data.html methods.html \
            flagged.html sources.html suggestions.html executive-summary.html \
            resolved.html portfolio.html \
            topics/gas-prices.html topics/elections.html topics/culture.html \
            topics/crypto.html topics/golf.html
      - name: Published-page link and nav parity check
        run: node scripts/check_links.mjs

  snapshot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Collect verified snapshots from the official demo API
        run: python3 scripts/collect.py
      # ORDERING (deliberate): the gate runs AFTER the collection and BEFORE
      # the commit, so data that violates the topic rules can never be
      # published. REQUIRE_FRESH_SNAPSHOT=1 makes a stale snapshot a hard
      # failure here.
      - name: "Collector classification and pagination regression gate (defects D1 and D3)"
        env:
          REQUIRE_FRESH_SNAPSHOT: '1'
        run: python3 tests/test_collect.py
      - name: Check links and source links
        run: node scripts/check_site.mjs
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no snapshot change"
          else
            git commit -m "data: verified snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
