name: Live client (governor + endpoint contract)

# Scope: the live browser client (assets/governor.js + assets/app.js) and the demo-API
# contracts it depends on. Split out from pages.yml so this session's checks never
# contend with the shared site workflow.
#
#  client    — offline only: governor unit tests, verbatim-response contract tests,
#              probe self-tests. No network, so it cannot flake with the exchange.
#  contract  — one run of scripts/api_contract.py against the live DEMO API from a
#              runner (the build sandbox cannot reach kalshi.co), publishing
#              data/endpoint_contract.json: for every endpoint the dashboard calls,
#              the HTTP status, the required fields, the observed X-RateLimit-*
#              headers and the CORS answer. A documented contract breaking makes
#              this job red, and the evidence is committed either way so the Data
#              page shows what changed rather than going stale silently.

on:
  schedule:
    - cron: '37 */3 * * *'          # 20 minutes after the collector's :17 run
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/governor.js'
      - 'assets/app.js'
      - 'assets/model.js'
      - 'assets/site.css'
      - 'tests/rate_governor.test.mjs'
      - 'tests/live_contract.test.mjs'
      - 'scripts/api_contract.py'
      - 'data/samples/**'
      - '.github/workflows/live-client.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: live-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Offline gates (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install the test dependency (jsdom)
        run: npm install --no-audit --no-fund jsdom@26.1.0
      - name: Syntax
        run: node --check assets/governor.js && node --check assets/app.js && node --check assets/model.js
      - name: Request governor (pacing, priority, coalescing, 429 backoff, shedding)
        run: bash .github/workflows/run-and-annotate.sh 'governor' node tests/rate_governor.test.mjs
      - name: Live-response contract tests (verbatim demo-API fixtures)
        run: bash .github/workflows/run-and-annotate.sh 'live contract' node tests/live_contract.test.mjs
      - name: Probe self-tests (offline)
        run: bash .github/workflows/run-and-annotate.sh 'api_contract --selftest' python3 scripts/api_contract.py --selftest

  contract:
    name: Live endpoint contract probe
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Probe the documented endpoints on the live demo API
        # continue-on-error: a contract break must still publish its evidence.
        continue-on-error: true
        run: python3 scripts/api_contract.py --out data/endpoint_contract.json
      - name: Report the findings (annotations + PR comment; the runner log is unreadable from the build sandbox)
        if: always()
        run: |
          python3 - <<'PY' > /tmp/findings.md
          import json, os, sys
          p = 'data/endpoint_contract.json'
          if not os.path.exists(p):
              print('::error::the probe wrote no output file — it crashed before reporting')
              sys.exit(0)
          d = json.load(open(p, encoding='utf-8'))
          def esc(x):
              return str(x).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def miss(c):
              return (c.get('item_fields_missing') or []) + (c.get('missing_top_level_fields') or [])
          d_bad = [c for c in d['cases'] if c.get('verdict') != 'ok' and not c.get('informative')]
          d_info = [c for c in d['cases'] if c.get('informative') or c.get('verdict') == 'ok']
          s = d['summary']
          print('::notice::' + esc('endpoint contract: %d/%d ok, %d mismatched, %d informative'
                % (s['ok'], s['cases'], s['failed'], s['informative'])))
          for c in d_bad:
              bits = ['id=' + c['id'], 'verdict=' + str(c.get('verdict')),
                      'status=%s want %s' % (c.get('http_status'), c.get('expected_status'))]
              if miss(c):
                  bits.append('missing fields: ' + ','.join(miss(c)))
              if c.get('items_seen') is not None:
                  bits.append('items=%s' % c.get('items_seen'))
              if c.get('error'):
                  bits.append('error=' + str(c.get('error'))[:150])
              print('::error::' + esc('endpoint-contract ' + '; '.join(bits)))
          print('| case | verdict | got | expected | items | missing fields | error |')
          print('|---|---|---|---|---|---|---|')
          for c in d['cases']:
              print('| `%s` | %s%s | %s | %s | %s | %s | %s |' % (
                  c['id'], c.get('verdict'),
                  ' *(informative)*' if c.get('informative') else '',
                  c.get('http_status'), c.get('expected_status'), c.get('items_seen'),
                  ', '.join(miss(c)) or '—', str(c.get('error') or '—')[:110]))
          print()
          print('generated %s · sample market %s · probe exit-time summary `%s`'
                % (d.get('generated_at'), (d.get('sample_market') or {}).get('ticker'), json.dumps(s)))
          PY
          cat /tmp/findings.md
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then cat /tmp/findings.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            { echo "### Endpoint-contract probe (live demo API, from this runner)"; echo;
              echo 'Generated by \`.github/workflows/live-client.yml\` → \`scripts/api_contract.py\`. Read-only evidence for the reviewer; the verdict is the next step.'; echo;
              cat /tmp/findings.md; } > /tmp/comment.md
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh pr comment "${{ github.event.number }}" --body-file /tmp/comment.md || echo 'comment skipped'
          fi
      - name: Publish the evidence (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/endpoint_contract.json
          if git diff --cached --quiet; then
            echo "endpoint contract unchanged"
          else
            git commit -m "data: endpoint contract probe $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Fail the job if a documented contract broke
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('data/endpoint_contract.json', encoding='utf8'))
          except Exception as e:
              print('::error::' + 'the probe produced no evidence: ' + str(e).replace('\n', ' ')); sys.exit(1)
          bad = [c for c in d['cases'] if c.get('verdict') != 'ok' and not c.get('informative')]
          print('endpoint contract:', d['summary']['ok'], 'ok /', d['summary']['cases'], 'cases;',
                d['summary']['failed'], 'failed;', d['summary']['informative'], 'informative')
          for c in bad:
              print('  MISMATCH', c['id'], '->', c.get('verdict'), 'status', c.get('http_status'),
                    'expected', c.get('expected_status'), c.get('doc'))
          if bad:
              print('::error::' + ('endpoint contract: %d case(s) disagree with the published docs — see the '
                    'annotations and the PR comment above' % len(bad)).replace('\n', ' '))
          sys.exit(1 if bad else 0)
          PY
