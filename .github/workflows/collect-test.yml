name: collect-test

# Dry run of the whole data pipeline on demand, without deploying. Used to prove the collector,
# time series, resolutions and paper engine work against the live API before a deploy.
on:
  workflow_dispatch:
  push:
    paths:
      - "collector/**"
      - "tests/**"
      - ".github/workflows/collect-test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check cryptography
      - run: python -m unittest discover -s tests -v
      - name: Collect (demo endpoint first, as the brief specifies)
        run: python -m collector.collect --base https://external-api.demo.kalshi.co/trade-api/v2 --out data/markets/demo.json
      - name: Collect (production public read endpoint)
        run: python -m collector.collect --base https://api.elections.kalshi.com/trade-api/v2
      - run: python -m collector.track
      - run: python -m collector.resolutions
      - run: python -m collector.paper_engine
      - run: python -m collector.paper_engine
      - name: Show what was produced
        run: |
          echo "== counts =="
          python - <<'PY'
          import json
          for p in ("data/markets/latest.json","data/jumps.json","data/paper/summary.json","data/resolution_summary.json"):
              try:
                  d=json.load(open(p))
              except Exception as e:
                  print(p,"MISSING",e); continue
              if p.endswith("latest.json"):
                  print(p,"markets",len(d["markets"]),"events",len(d["events"]),"counts",d["counts"])
              elif "jumps" in d:
                  print(p,"jumps",len(d["jumps"]))
              elif "strategies" in d:
                  print(p,"equity",d["equity"],"trades",d["closed_trades"],"open",d["open_positions"])
              else:
                  print(p,"tracked",d.get("tracked"),"resolved",d.get("resolved"))
          PY
      - name: Upload pipeline output
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: data
          if-no-files-found: warn
