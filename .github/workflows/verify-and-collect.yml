name: Verify demo API and collect snapshots

on:
  push:
    branches: [arena/bb8bd1ff-trade1, main]
    paths:
      - "scripts/**"
      - ".github/workflows/verify-and-collect.yml"
  workflow_dispatch:
  schedule:
    # Runs on the default branch after merge; refreshes data/ snapshots twice hourly.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: verify-and-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Run verification + collection (stdlib Python)
        run: python3 scripts/collect.py

      - name: Commit refreshed snapshots
        run: |
          git config user.name "trade1-verify-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "data: verify+collect snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git push
          fi

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-snapshots
          path: data
          if-no-files-found: warn
