name: probe (discovery, manual)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "probe script under scripts/"
        required: true
        default: probe_discovery2.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run probe
        run: mkdir -p probe && python3 scripts/${{ inputs.script }} > probe/output2.txt 2>&1; echo "exit=$?" >> probe/output2.txt
      - name: Commit probe output to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe/output2.txt
          git commit -m "probe output 2" || echo "nothing"
          git push origin HEAD:${GITHUB_REF_NAME}
