name: probe-api

# Manual/one-off verification probe. Runs on a GitHub runner because the API is only
# reachable from environments with open egress.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Trade API base URL
        required: true
        default: https://external-api.demo.kalshi.co/trade-api/v2
  push:
    paths:
      - "scripts/probe_api.py"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe demo endpoints
        run: |
          python scripts/probe_api.py --base "${{ github.event.inputs.base || 'https://external-api.demo.kalshi.co/trade-api/v2' }}" --out research/probe/demo --full-markets
      - name: Probe production read-only endpoints (public market data only)
        run: |
          python scripts/probe_api.py --base https://api.elections.kalshi.com/trade-api/v2 --out research/probe/prod
      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: research/probe
          if-no-files-found: warn
      - name: Commit probe results
        run: |
          git config user.name "trade1-bot"
          git config user.email "trade1-bot@users.noreply.github.com"
          git add research/probe
          git diff --cached --quiet || git commit -m "chore(research): refresh API probe dump [skip ci]"
          git push || echo "push skipped"
