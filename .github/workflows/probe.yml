name: probe (discovery, manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run discovery probe
        run: mkdir -p probe && python3 scripts/probe_discovery.py > probe/output.txt 2>&1; echo "exit=$?" >> probe/output.txt
      - name: Commit probe output to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe/output.txt
          git commit -m "probe output (manual discovery run)" || echo "nothing"
          git push origin HEAD:${GITHUB_REF_NAME}
