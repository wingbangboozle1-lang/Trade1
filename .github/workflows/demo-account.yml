# Demo account track (Kalshi DEMO environment only).
# - Scheduled run: read-only snapshot of balance and positions (no orders).
# - Manual run (workflow_dispatch):
#     mode=snapshot  read-only snapshot
#     mode=plan      build an order plan from public demo markets and dry-run it (nothing sent)
#     mode=live      build the plan and send guarded DEMO orders (max 3 orders / $3.00 per run, buy YES only)
# Credentials come only from repository secrets KALSHI_DEMO_KEY_ID and KALSHI_DEMO_PRIVATE_KEY.
# Without them the job records "not configured" and sends no authenticated request.
name: Demo account track

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'snapshot (read-only) | plan (dry-run) | live (guarded demo orders)'
        type: choice
        options: [snapshot, plan, live]
        default: snapshot

permissions:
  contents: write

concurrency:
  group: demo-account-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KALSHI_DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
      KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
      WRITE_STATUS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline self-tests (no network, no credentials)
        run: node scripts/demo_account/selftest.mjs

      - name: Read-only demo snapshot
        run: node scripts/demo_account/snapshot.mjs

      - name: Build order plan from public demo markets
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'snapshot'
        run: node scripts/demo_account/make_plan.mjs

      - name: Execute plan (dry-run unless mode=live and credentials exist)
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'snapshot'
        env:
          ALLOW_DEMO_ORDERS: ${{ inputs.mode == 'live' && 'true' || 'false' }}
        run: node scripts/demo_account/execute.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/demo_account
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Demo account data update [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
