name: Trade1 site · collect Kalshi data (every 6h)

# Publishes the /trade1/ site. GitHub Pages serves the repository root from `main`
# (legacy source), so the refreshed data is committed to trade1/data/ with [skip ci].
# Public, read-only Kalshi endpoints only. No keys, no orders.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade1-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public Kalshi market data (read-only)
        env:
          TRADE1_STATE_URL: https://wingbangboozle1-lang.github.io/Trade1/trade1/data/tracked.json
        run: python3 scripts/trade1_collect.py

      - name: Check trade1 site (links, source links, flagged blanks)
        run: |
          node --check trade1/assets/app.js
          python3 scripts/trade1_check.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade1/data/markets.json trade1/data/tracked.json
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "Refresh trade1 market data (Kalshi public API) [skip ci]"
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
