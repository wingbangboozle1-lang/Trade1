name: Build and deploy Kalshi demo monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer dependency
        run: python3 -m pip install --quiet markdown
      - name: Build site from official Kalshi API data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p probe/build
          python3 scripts/build_site.py --out _site 2>&1 | tee probe/build/build.log
      - name: Check internal links and data files
        run: python3 scripts/check_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Save build report to the branch (non-main, skip-ci commit)
        if: always() && github.event_name != 'push' && github.ref != 'refs/heads/main'
        env:
          BR: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p /tmp/report
          cp _site/data/meta.json _site/data/flags.json /tmp/report/ 2>/dev/null || true
          cp _site/data/backtest.json /tmp/report/ 2>/dev/null || true
          cp probe/build/build.log /tmp/report/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BR"
          git checkout -q -B "$BR" "origin/$BR"
          mkdir -p probe/build
          cp /tmp/report/* probe/build/ 2>/dev/null || true
          git add -f probe/build
          git commit -q -m "build report from CI [skip ci]" || echo "nothing to commit"
          git push origin "HEAD:$BR" || echo "PUSH FAILED"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
