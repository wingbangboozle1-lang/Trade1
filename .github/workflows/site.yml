name: Build and deploy Kalshi demo monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer dependency
        run: python3 -m pip install --quiet markdown
      - name: Build site from official Kalshi API data
        run: python3 scripts/build_site.py --out _site
      - name: Check internal links and data files
        run: python3 scripts/check_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Save build report to this branch (non-main test builds only)
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: |
          mkdir -p probe/build
          cp _site/data/meta.json _site/data/flags.json probe/build/
          cp _site/data/backtest.json probe/build/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe/build
          git commit -m "test build report (non-main)" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "push skipped"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
